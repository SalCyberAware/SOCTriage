# Dependency update proposals — Tier 2 of PromptShield's docs/AUTOMATION_PLAN.md.
#
# Tier 2 means Dependabot PROPOSES and a human merges. There is no auto-merge
# here and there must not be: the plan rules it out explicitly, including for
# patch updates, because unattended automation is what produced the September
# 2026 silent failure in the first place.
#
# Shape of the config, per the plan's Tier 2 grouping rules:
#   - non-major backend updates      -> one grouped PR per week
#   - non-major frontend updates     -> one grouped PR per week
#   - GitHub Actions bumps           -> one grouped PR per month
#   - major bumps                    -> one PR per package, never grouped,
#                                       because a major is a reading task
#   - security advisories            -> their own group, opened as soon as the
#                                       advisory lands rather than on schedule
#
# Majors fall out of the weekly groups because those groups only claim
# "minor" and "patch"; anything left ungrouped gets its own PR automatically.
#
# The security group is deliberately a separate group rather than a separate
# label: Dependabot puts the group name in the PR title and branch, and labels
# are per-ecosystem rather than per-group, so the group name is the only thing
# that actually makes an advisory fix visibly distinct from a routine bump at a
# glance.
#
# `open-pull-requests-limit` caps VERSION updates only. Security updates are not
# subject to it, so a conservative limit here cannot suppress an advisory fix.
#
# The plan's Tier 2 gate -- do not point a dependency bot at a surface CI does
# not cover -- was the reason this repo was last in line. It gained a frontend
# job (eslint + vite build + vitest) and backend ruff/mypy on 2026-09-18, so
# both surfaces are now covered and the gate is satisfied.
#
# Scheduling is staggered across the three repos -- PromptShield Monday,
# ThreatScan Tuesday, SOCTriage Wednesday -- so a quiet week does not arrive as
# one Monday pile.

version: 2

updates:
  # ── Backend (uv, FastAPI service) ─────────────────────────────────────────
  # requirements.in and requirements-dev.in hold the ranges; requirements.txt
  # and requirements-dev.txt are hashed locks compiled from them with
  # `uv pip compile --universal --generate-hashes`. The "uv" ecosystem, not
  # "pip", because it reruns that same command with the flags read back from
  # each lock's header, so a bump keeps the hashes and the universal markers.
  # Runtime and tooling bumps still arrive together in one reviewable PR.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python", "backend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # SQLAlchemy is held on the 2.0 line. 2.1 changed the default driver for a
    # bare postgresql:// URL to psycopg (v3), which is not installed, and taking
    # 2.1 through an unpinned range took production down. See the "Backend
    # crashed on startup against Postgres" entry under [Unreleased] > Fixed in
    # CHANGELOG.md. Moving to 2.1 is a deliberate upgrade made together with
    # the driver change, so remove this rule as part of that work.
    ignore:
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      backend-security-advisories:
        applies-to: security-updates
        patterns: ["*"]

  # ── Backend Docker base image (backend/Dockerfile) ────────────────────────
  # The base image is pinned by digest, which goes stale silently as Debian
  # and Python ship security fixes. This proposes the new digest for the same
  # tag. The Python minor is held: 3.11 matches the lock's --python-version, so
  # moving off it is a planned change made together with a recompiled lock,
  # not a bot bump.
  #
  # The image comes from public.ecr.aws/docker/library, Amazon's public mirror
  # of Docker Hub's official images. Dependabot reads that registry from the
  # FROM line and lists its tags anonymously; no registry credentials are
  # needed. It names the dependency by its path there (docker/library/python),
  # so the ignore rule matches any name ending in "python".
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ── Frontend (npm, React + Vite) ──────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels: ["dependencies", "javascript", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-security-advisories:
        applies-to: security-updates
        patterns: ["*"]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Monthly, per the plan. A pinned action version goes stale silently: nothing
  # in CI fails when actions/checkout@v5 becomes two majors old, so the only
  # thing that surfaces it is a bot that reads the workflow files.
  #
  # Every `uses:` is pinned to a full commit SHA with the exact version as a
  # trailing comment (`@<sha> # v7.0.1`), so a moved tag cannot change what
  # runs. Dependabot reads that comment and updates the SHA and the comment
  # together, which keeps the pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security-advisories:
        applies-to: security-updates
        patterns: ["*"]
