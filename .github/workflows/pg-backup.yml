name: Database backup job

# Tests ops/pg-backup, the nightly pg_dump job that backs the production
# Postgres up to a Railway storage bucket. Nothing here reaches Railway: the
# database and the bucket are throwaway containers that exist only for the
# length of the job, and every credential is a placeholder.
#
# Kept apart from backend-tests.yml because the job is a separate image with
# its own base, and a red run here should name the backup job, not the API.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (backup.sh, restore-drill.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck ships on the runner image. --shell=sh holds the scripts to
      # POSIX sh, which is what Alpine's busybox runs them with.
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck --shell=sh --severity=style ops/pg-backup/backup.sh ops/pg-backup/restore-drill.sh

  end-to-end:
    name: Backup image (build, dump, upload, prune, restore, restore test)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 18, the production major. Pinned by digest; from the same
        # public mirror the image itself is built from.
        image: public.ecr.aws/docker/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: soctriage
          POSTGRES_DB: soctriage_ci
          # No password at all rather than a placeholder one: the service is
          # reachable only from this job and gone when it ends.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soctriage -d soctriage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      s3:
        # Adobe S3Mock 5.2.3, an S3-compatible stand-in for the bucket. MinIO
        # no longer publishes a container image. S3Mock accepts any
        # credentials and supports path-style URLs only.
        image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: soctriage-backups
        ports:
          - 9090:9090

    env:
      IMAGE: soctriage-pg-backup:ci
      DRILL_IMAGE: soctriage-restore-drill:ci
      # For the test's own setup and checks.
      PG_URL: postgresql://soctriage@127.0.0.1:5432
      S3_URL: http://127.0.0.1:9090
      BUCKET_NAME: soctriage-backups
      # Placeholders handed to the backup container. The server ignores the
      # password (trust auth); it is there so the log checks can prove neither
      # it nor the secret key is ever printed.
      DB_PASSWORD_MARKER: ci-db-password-must-not-be-logged
      SECRET_MARKER: ci-secret-key-must-not-be-logged

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A decoy proves .dockerignore keeps env files out of the image.
      - name: Plant a decoy .env file
        run: echo "DECOY=1" > ops/pg-backup/.env

      # public.ecr.aws answers anonymous pulls from GitHub runners with 429
      # "Data limit exceeded" now and then. Pull every digest-pinned base image
      # here with backoff (waits of 20, 40, 80 and 160 s), so the build below
      # finds it locally and never asks the registry itself. The FROM lines are
      # pinned by digest, so building from the local copy gives the same image.
      - name: Pull the base image (retries on registry rate limits)
        env:
          DOCKERFILES: ops/pg-backup/Dockerfile ops/pg-backup/Dockerfile.restore-drill
        run: |
          refs=$(echo "$DOCKERFILES" | xargs grep -hiE '^[[:space:]]*FROM[[:space:]]' | grep -oE '[^[:space:]]+@sha256:[0-9a-f]{64}' | sort -u) || true
          test -n "$refs" || { echo "no digest-pinned FROM line in $DOCKERFILES"; exit 1; }
          pull_err="$RUNNER_TEMP/base-image-pull.err"
          for ref in $refs; do
            echo "Pulling ${ref%%@*}"
            attempt=0
            for wait_s in 20 40 80 160 last; do
              attempt=$((attempt + 1))
              status=0
              docker pull --quiet "$ref" >/dev/null 2>"$pull_err" || status=$?
              echo "attempt $attempt: exit $status"
              if [ "$status" -eq 0 ]; then continue 2; fi
              if [ "$wait_s" != last ]; then sleep "$wait_s"; fi
            done
            echo "Every attempt failed. Last 5 lines of the last error:"
            tail -n 5 "$pull_err"
            exit 1
          done

      - name: Build the image
        run: docker build -t "$IMAGE" ops/pg-backup

      - name: Image runs as non-root, holds no env file, and has pg_dump 18 or newer
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          docker run --rm --entrypoint sh "$IMAGE" -c '
            found=$(find / -xdev -name ".env" -not -path "/proc/*" 2>/dev/null)
            test -z "$found" || { echo "unexpected files:"; echo "$found"; exit 1; }'
          # The folder now holds a second script for the restore test image.
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test -f /usr/local/bin/backup.sh || { echo "backup.sh missing"; exit 1; }
            test ! -e /usr/local/bin/restore-drill.sh || { echo "restore-drill.sh copied into the backup image"; exit 1; }'
          version=$(docker run --rm --entrypoint pg_dump "$IMAGE" --version)
          echo "$version"
          major=$(echo "$version" | sed -E 's/.* ([0-9]+)\..*/\1/')
          test "$major" -ge 18 || { echo "pg_dump $major cannot dump a Postgres 18 server"; exit 1; }
          docker run --rm --entrypoint aws "$IMAGE" --version
          docker run --rm --entrypoint curl "$IMAGE" --version | head -n 1
          # The plain-http switch is for the heartbeat test below only.
          if docker image inspect "$IMAGE" --format '{{json .Config.Env}}' | grep -q HEARTBEAT; then
            echo "the image sets a HEARTBEAT variable"; exit 1
          fi

      # Helpers the steps below share. run-backup.sh starts the backup
      # container with the standard placeholder settings; extra docker
      # arguments (for example -e NAME=value) override them. s3.sh runs the
      # image's AWS CLI against the stand-in bucket. check-log.sh fails if a
      # log shows a credential, a URL or the database address.
      - name: Write test helpers
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/s3data"
          printf '[default]\ns3 =\n    addressing_style = path\n' > "$RUNNER_TEMP/aws-config"

          cat > "$RUNNER_TEMP/bin/run-backup.sh" <<'EOF'
          #!/bin/sh
          # Usage: run-backup.sh LOGFILE [docker run arguments...]
          log=$1; shift
          docker run --rm --network host \
            -e DATABASE_URL="postgresql://soctriage:$DB_PASSWORD_MARKER@127.0.0.1:5432/soctriage_ci" \
            -e AWS_ACCESS_KEY_ID=ci-access-key-id \
            -e AWS_SECRET_ACCESS_KEY="$SECRET_MARKER" \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e ENDPOINT="$S3_URL" \
            -e BUCKET="$BUCKET_NAME" \
            -e S3_ADDRESSING_STYLE=path \
            "$@" "$IMAGE" > "$log" 2>&1
          status=$?
          cat "$log"
          exit $status
          EOF

          cat > "$RUNNER_TEMP/bin/s3.sh" <<'EOF'
          #!/bin/sh
          exec docker run --rm --network host --user "$(id -u)" \
            -v "$RUNNER_TEMP/aws-config:/tmp/aws-config:ro" -e AWS_CONFIG_FILE=/tmp/aws-config \
            -v "$RUNNER_TEMP/s3data:/data" \
            -e AWS_ACCESS_KEY_ID=ci-access-key-id -e AWS_SECRET_ACCESS_KEY=ci-placeholder \
            -e AWS_DEFAULT_REGION=us-east-1 \
            --entrypoint aws "$IMAGE" --endpoint-url "$S3_URL" "$@"
          EOF

          cat > "$RUNNER_TEMP/bin/check-log.sh" <<'EOF'
          #!/bin/sh
          for leak in "$DB_PASSWORD_MARKER" "$SECRET_MARKER" ci-access-key-id 127.0.0.1 "://" ; do
            if grep -qF -- "$leak" "$1"; then
              echo "log shows something it must not: $leak"; exit 1
            fi
          done
          echo "log is clean"
          EOF

          cat > "$RUNNER_TEMP/bin/psql.sh" <<'EOF'
          #!/bin/sh
          # Usage: psql.sh DATABASE [psql arguments...]
          db=$1; shift
          exec docker run --rm -i --network host --entrypoint psql "$IMAGE" \
            "$PG_URL/$db" -v ON_ERROR_STOP=1 -X -q "$@"
          EOF

          chmod +x "$RUNNER_TEMP"/bin/*.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Wait for the stand-in bucket
        run: |
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$S3_URL/" && exit 0
            sleep 2
          done
          echo "S3Mock did not answer in 60s"; exit 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with backend/runtime.txt.
          python-version: '3.11.9'

      # The real schema, built the way production builds it: Alembic from an
      # empty database to head. Only the production lock is needed for that.
      - name: Create the SOCTriage schema with Alembic
        working-directory: backend
        env:
          DATABASE_URL: postgresql://soctriage@127.0.0.1:5432/soctriage_ci
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r requirements.txt
          "$RUNNER_TEMP/venv/bin/alembic" upgrade head

      # Fake cases only, with documentation addresses.
      - name: Add fake cases
        run: |
          psql.sh soctriage_ci <<'SQL'
          INSERT INTO cases (case_id, ioc, ioc_type, status, severity, created_at, updated_at,
                             analyst_notes, enrichment, report, timeline, owner_hash) VALUES
            ('CI00000001', '198.51.100.7', 'ip', 'open', 'high', now(), now(),
             'Fake case for the backup test', NULL, NULL, '[]', NULL),
            ('CI00000002', '203.0.113.9', 'ip', 'closed', 'low', now() - interval '2 days', now(),
             NULL, '{"verdict": "clean", "score": 0}', NULL, '[{"action": "closed"}]', NULL),
            ('CI00000003', 'example.com', 'domain', 'in_progress', 'medium', now(), now(),
             NULL, NULL, '{"title": "Fake report"}', '[]', repeat('a', 64));
          SQL
          psql.sh soctriage_ci -c "SELECT count(*) AS cases FROM cases"

      - name: A missing variable fails, names the variable, shows no secret
        run: |
          if run-backup.sh missing.log -e AWS_SECRET_ACCESS_KEY= -e ENDPOINT=; then
            echo "expected a failure"; exit 1
          fi
          grep -q "missing required variable(s): AWS_SECRET_ACCESS_KEY ENDPOINT" missing.log
          check-log.sh missing.log

      - name: Bad optional settings fail with a clear message
        run: |
          if run-backup.sh days.log -e RETENTION_DAYS=0; then echo "RETENTION_DAYS=0 accepted"; exit 1; fi
          grep -q "RETENTION_DAYS must be a positive whole number" days.log
          if run-backup.sh days2.log -e RETENTION_DAYS=abc; then echo "RETENTION_DAYS=abc accepted"; exit 1; fi
          grep -q "RETENTION_DAYS must be a positive whole number" days2.log
          if run-backup.sh prefix.log -e BACKUP_PREFIX=/; then echo "BACKUP_PREFIX=/ accepted"; exit 1; fi
          grep -q "BACKUP_PREFIX must be" prefix.log
          if run-backup.sh prefix2.log -e BACKUP_PREFIX=soctriage; then echo "prefix without / accepted"; exit 1; fi
          grep -q "BACKUP_PREFIX must end with /" prefix2.log
          for f in days.log days2.log prefix.log prefix2.log; do check-log.sh "$f"; done

      # pg_dump's own error names the host and port. The log must not.
      - name: An unreachable database fails without showing its address
        run: |
          if run-backup.sh unreachable.log \
               -e DATABASE_URL="postgresql://soctriage:$DB_PASSWORD_MARKER@127.0.0.1:1/soctriage_ci"; then
            echo "expected a failure"; exit 1
          fi
          grep -q "pg_dump failed 3 times" unreachable.log
          check-log.sh unreachable.log

      - name: A database without the SOCTriage tables fails the archive check
        run: |
          psql.sh soctriage_ci -c "CREATE DATABASE not_soctriage"
          if run-backup.sh wrongdb.log \
               -e DATABASE_URL="postgresql://soctriage:$DB_PASSWORD_MARKER@127.0.0.1:5432/not_soctriage"; then
            echo "expected a failure"; exit 1
          fi
          grep -q "dump has no cases table" wrongdb.log
          check-log.sh wrongdb.log

      # Retention fixtures: an expired backup inside the prefix (must go), an
      # expired backup-named file outside the prefix and a file in the prefix
      # that is not a backup (both must stay), and a day-old backup (must stay).
      - name: Plant objects for the retention check
        run: |
          echo "fixture" > "$RUNNER_TEMP/s3data/fixture"
          recent="soctriage-$(date -u -d '1 day ago' +%Y%m%dT%H%M%SZ).dump"
          echo "RECENT_KEY=soctriage/$recent" >> "$GITHUB_ENV"
          for key in soctriage/soctriage-20200101T000000Z.dump \
                     elsewhere/soctriage-20200101T000000Z.dump \
                     soctriage/notes.txt \
                     "soctriage/$recent"; do
            s3.sh s3 cp /data/fixture "s3://$BUCKET_NAME/$key" --only-show-errors
          done

      - name: Run a backup
        run: |
          run-backup.sh first.log
          for line in "start: backup" "dump size: " "archive valid, lists cases and alembic_version" \
                      "upload done: soctriage/soctriage-" "size matches" \
                      "pruned soctriage/soctriage-20200101T000000Z.dump" \
                      "objects pruned: 1 older than 30 days, 2 backups kept" "finished: "; do
            grep -qF -- "$line" first.log || { echo "missing log line: $line"; exit 1; }
          done
          check-log.sh first.log
          echo "FIRST_KEY=$(sed -n 's/.*finished: //p' first.log)" >> "$GITHUB_ENV"

      - name: Retention removed only the expired backup inside the prefix
        run: |
          s3.sh s3api list-objects-v2 --bucket "$BUCKET_NAME" --query 'Contents[].[Key]' --output text | sort > keys.txt
          cat keys.txt
          ! grep -qx "soctriage/soctriage-20200101T000000Z.dump" keys.txt || { echo "expired backup kept"; exit 1; }
          for key in elsewhere/soctriage-20200101T000000Z.dump soctriage/notes.txt "$RECENT_KEY" "$FIRST_KEY"; do
            grep -qxF "$key" keys.txt || { echo "missing: $key"; exit 1; }
          done

      # A second night: nothing is old enough to prune, and both new backups
      # stay. With RETENTION_DAYS=1 the day-old planted backup goes as well,
      # while the newest is kept.
      - name: Run a second backup with a one-day retention
        run: |
          sleep 1
          run-backup.sh second.log -e RETENTION_DAYS=1
          grep -qF "pruned $RECENT_KEY" second.log
          grep -qF "objects pruned: 1 older than 1 days, 2 backups kept" second.log
          check-log.sh second.log
          echo "SECOND_KEY=$(sed -n 's/.*finished: //p' second.log)" >> "$GITHUB_ENV"

      - name: Restore the newest backup into a fresh database and compare
        run: |
          s3.sh s3api list-objects-v2 --bucket "$BUCKET_NAME" --prefix soctriage/soctriage- \
            --query 'Contents[].[Key]' --output text | sort > backups.txt
          cat backups.txt
          test "$(wc -l < backups.txt)" -eq 2 || { echo "expected two backups"; exit 1; }
          grep -qxF "$FIRST_KEY" backups.txt
          newest=$(tail -n 1 backups.txt)
          test "$newest" = "$SECOND_KEY" || { echo "newest is $newest, expected $SECOND_KEY"; exit 1; }

          s3.sh s3 cp "s3://$BUCKET_NAME/$newest" /data/restore.dump --only-show-errors
          psql.sh soctriage_ci -c "CREATE DATABASE soctriage_restore"
          docker run --rm --network host -v "$RUNNER_TEMP/s3data:/data:ro" --entrypoint pg_restore "$IMAGE" \
            --no-owner --clean --if-exists --exit-on-error \
            --dbname="$PG_URL/soctriage_restore" /data/restore.dump

          query="SELECT (SELECT count(*) FROM cases) || ' cases, '
                     || (SELECT count(*) FROM cases WHERE owner_hash IS NOT NULL) || ' owned, '
                     || (SELECT string_agg(case_id || ':' || status || ':' || md5(coalesce(report::text, '')), ',' ORDER BY case_id) FROM cases)
                     || ', alembic ' || (SELECT version_num FROM alembic_version)"
          source=$(psql.sh soctriage_ci -At -c "$query")
          restored=$(psql.sh soctriage_restore -At -c "$query")
          echo "source:   $source"
          echo "restored: $restored"
          test "$source" = "$restored" || { echo "restored data differs"; exit 1; }
          case "$restored" in "3 cases, 1 owned,"*) ;; *) echo "unexpected row counts"; exit 1 ;; esac

      # ── Restore test image (Dockerfile.restore-drill) ──────────────────────
      # The same backups, restored by restore-drill.sh into further databases
      # on the same Postgres 18 service. The decoy .env from above is still in
      # the folder.
      - name: Build the restore test image
        run: docker build -f ops/pg-backup/Dockerfile.restore-drill -t "$DRILL_IMAGE" ops/pg-backup

      - name: Restore test image runs as non-root, holds only its own script, and has pg_restore 18 or newer
        run: |
          uid=$(docker run --rm --entrypoint id "$DRILL_IMAGE" -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          docker run --rm --entrypoint sh "$DRILL_IMAGE" -c '
            found=$(find / -xdev -name ".env" -not -path "/proc/*" 2>/dev/null)
            test -z "$found" || { echo "unexpected files:"; echo "$found"; exit 1; }
            test -f /usr/local/bin/restore-drill.sh || { echo "restore-drill.sh missing"; exit 1; }
            test ! -e /usr/local/bin/backup.sh || { echo "backup.sh copied into the restore test image"; exit 1; }'
          version=$(docker run --rm --entrypoint pg_restore "$DRILL_IMAGE" --version)
          echo "$version"
          major=$(echo "$version" | sed -E 's/.* ([0-9]+)\..*/\1/')
          test "$major" -ge 18 || { echo "pg_restore $major cannot read a pg_dump 18 archive"; exit 1; }

      # run-drill.sh starts the restore test container against database $2
      # with the standard placeholder settings; extra docker arguments override
      # them. Its exit status is the container's. relations.sh counts tables
      # and views in schema public, the same thing the script's guard counts.
      - name: Write restore test helpers
        run: |
          cat > "$RUNNER_TEMP/bin/run-drill.sh" <<'EOF'
          #!/bin/sh
          # Usage: run-drill.sh LOGFILE DATABASE [docker run arguments...]
          log=$1; db=$2; shift 2
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=ci-access-key-id \
            -e AWS_SECRET_ACCESS_KEY="$SECRET_MARKER" \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e ENDPOINT="$S3_URL" \
            -e BUCKET="$BUCKET_NAME" \
            -e S3_ADDRESSING_STYLE=path \
            -e RESTORE_DATABASE_URL="postgresql://soctriage:$DB_PASSWORD_MARKER@127.0.0.1:5432/$db" \
            "$@" "$DRILL_IMAGE" > "$log" 2>&1
          status=$?
          cat "$log"
          exit $status
          EOF

          cat > "$RUNNER_TEMP/bin/relations.sh" <<'EOF'
          #!/bin/sh
          exec psql.sh "$1" -At -c "SELECT count(*) FROM pg_catalog.pg_class c
            JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p', 'v', 'm', 'f')"
          EOF

          chmod +x "$RUNNER_TEMP"/bin/*.sh

      # Every key with its size and ETag, to prove the restore tests change
      # nothing in the bucket.
      - name: Record the bucket before the restore tests
        run: |
          s3.sh s3api list-objects-v2 --bucket "$BUCKET_NAME" \
            --query 'Contents[].[Key,Size,ETag]' --output text | sort > "$RUNNER_TEMP/bucket-before.txt"
          cat "$RUNNER_TEMP/bucket-before.txt"
          psql.sh soctriage_ci -c "CREATE DATABASE soctriage_drill"

      - name: Restore test refuses when DATABASE_URL is set, even empty, and restores nothing
        run: |
          i=0
          for value in "postgresql://soctriage:$DB_PASSWORD_MARKER@127.0.0.1:5432/soctriage_ci" ""; do
            i=$((i + 1))
            status=0
            run-drill.sh "dburl$i.log" soctriage_drill -e DATABASE_URL="$value" || status=$?
            test "$status" -eq 1 || { echo "expected exit 1, got $status"; exit 1; }
            grep -q "FAILED: DATABASE_URL is set" "dburl$i.log"
            ! grep -qE "chosen:|download done|PASSED" "dburl$i.log" || { echo "went past the guard"; exit 1; }
            check-log.sh "dburl$i.log"
          done
          test "$(relations.sh soctriage_drill)" = 0 || { echo "target changed"; exit 1; }

      - name: Restore test refuses a target that is not empty, and restores nothing
        run: |
          psql.sh soctriage_ci -c "CREATE DATABASE soctriage_busy"
          psql.sh soctriage_busy -c "CREATE TABLE keep_me (x int)"
          status=0
          run-drill.sh busy.log soctriage_busy || status=$?
          test "$status" -eq 1 || { echo "expected exit 1, got $status"; exit 1; }
          grep -q "FAILED: target database is not empty: 1 tables or views in schema public" busy.log
          ! grep -qE "chosen:|download done|PASSED" busy.log || { echo "went past the guard"; exit 1; }
          check-log.sh busy.log
          test "$(relations.sh soctriage_busy)" = 1 || { echo "target changed"; exit 1; }
          test "$(psql.sh soctriage_busy -At -c "SELECT to_regclass('public.cases') IS NULL")" = t \
            || { echo "cases table was restored into a busy target"; exit 1; }

      - name: Bad restore test settings fail with a clear message
        run: |
          expect_fail() {
            log=$1; message=$2; shift 2
            status=0
            run-drill.sh "$log" soctriage_drill "$@" || status=$?
            test "$status" -eq 1 || { echo "$log: expected exit 1, got $status"; exit 1; }
            grep -qF -- "$message" "$log" || { echo "$log: missing message: $message"; exit 1; }
            check-log.sh "$log"
          }
          expect_fail missing-target.log "missing required variable(s): RESTORE_DATABASE_URL" -e RESTORE_DATABASE_URL=
          expect_fail bad-file.log "RESTORE_FILE must be a backup file name" -e RESTORE_FILE=../soctriage-20200101T000000Z.dump
          expect_fail no-file.log "backup soctriage-20000101T000000Z.dump not found under soctriage/" \
            -e RESTORE_FILE=soctriage-20000101T000000Z.dump
          expect_fail bad-prefix.log "BACKUP_PREFIX must end with /" -e BACKUP_PREFIX=soctriage
          expect_fail empty-prefix.log "no backups found under nothing-here/" -e BACKUP_PREFIX=nothing-here/
          # psql's own error names the host and port. The log must not.
          expect_fail unreachable.log "cannot reach the target database after 3 tries" \
            -e RESTORE_DATABASE_URL="postgresql://soctriage:$DB_PASSWORD_MARKER@127.0.0.1:1/soctriage_drill"
          test "$(relations.sh soctriage_drill)" = 0 || { echo "target changed"; exit 1; }

      # /tmp is a host folder here, so the step can see that the downloaded
      # file is gone once the container exits.
      - name: Restore test restores the newest backup and its counts match the seeded rows
        run: |
          mkdir -m 1777 "$RUNNER_TEMP/drill-tmp"
          run-drill.sh drill.log soctriage_drill -v "$RUNNER_TEMP/drill-tmp:/tmp"
          check-log.sh drill.log

          file=${SECOND_KEY#soctriage/}
          tables=$(psql.sh soctriage_ci -At -c "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'")
          alembic=$(psql.sh soctriage_ci -At -c "SELECT version_num FROM alembic_version")
          for pattern in "file: +$file\$" "file size: +[1-9][0-9]* bytes\$" "download: +[0-9]+ s\$" \
                         "restore: +[0-9]+ s \(measured restore time\)\$" "tables restored: +$tables\$" \
                         "cases rows: +3\$" "newest case: +[0-9TZ:-]+, not later than the backup time " \
                         "alembic version: +$alembic\$" "PASSED: $file restored and checked\$"; do
            grep -qE -- "$pattern" drill.log || { echo "missing log line: $pattern"; exit 1; }
          done

          # The script's mktemp folder (tmp.*) and the backup it downloaded.
          leftover=$(find "$RUNNER_TEMP/drill-tmp" -mindepth 1 \( -name 'tmp.*' -o -name '*.dump' \))
          test -z "$leftover" || { echo "left behind:"; echo "$leftover"; exit 1; }

          query="SELECT (SELECT count(*) FROM cases) || ' cases, '
                     || (SELECT count(*) FROM cases WHERE owner_hash IS NOT NULL) || ' owned, '
                     || (SELECT string_agg(case_id || ':' || status || ':' || md5(coalesce(report::text, '')), ',' ORDER BY case_id) FROM cases)
                     || ', alembic ' || (SELECT version_num FROM alembic_version)"
          source=$(psql.sh soctriage_ci -At -c "$query")
          restored=$(psql.sh soctriage_drill -At -c "$query")
          echo "source:   $source"
          echo "restored: $restored"
          test "$source" = "$restored" || { echo "restored data differs"; exit 1; }

      - name: Restore test restores a named older backup with RESTORE_FILE
        run: |
          psql.sh soctriage_ci -c "CREATE DATABASE soctriage_drill2"
          file=${FIRST_KEY#soctriage/}
          run-drill.sh named.log soctriage_drill2 -e RESTORE_FILE="$file"
          check-log.sh named.log
          grep -qE "file: +$file\$" named.log
          grep -qE "cases rows: +3\$" named.log
          grep -qE "PASSED: $file restored and checked\$" named.log

      - name: Restore tests left the bucket unchanged
        run: |
          s3.sh s3api list-objects-v2 --bucket "$BUCKET_NAME" \
            --query 'Contents[].[Key,Size,ETag]' --output text | sort > "$RUNNER_TEMP/bucket-after.txt"
          diff "$RUNNER_TEMP/bucket-before.txt" "$RUNNER_TEMP/bucket-after.txt" \
            || { echo "the bucket changed"; exit 1; }

      # ── Heartbeat (HEARTBEAT_URL) ──────────────────────────────────────────
      # A local listener stands in for healthchecks.io and records each request
      # as "METHOD PATH BODY". HEARTBEAT_ALLOW_HTTP=1 lets the script reach it
      # over plain http; the image never sets that. These runs come last
      # because the successful ones add backups the steps above count.
      # hb-start.sh starts the listener and records its PID, hb-stop.sh stops
      # that PID, and hb-expect.sh fails unless the recorded requests are
      # exactly its arguments, in order.
      - name: Write heartbeat test helpers
        run: |
          cat > "$RUNNER_TEMP/hb-listener.py" <<'EOF'
          import http.server, sys

          port, out = int(sys.argv[1]), sys.argv[2]

          class Handler(http.server.BaseHTTPRequestHandler):
              def record(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(n).decode("utf-8", "replace") if n else ""
                  with open(out, "a", encoding="utf-8", newline="\n") as f:
                      f.write(f"{self.command} {self.path} {body}".rstrip() + "\n")
                  self.send_response(200)
                  self.send_header("Content-Length", "2")
                  self.end_headers()
                  self.wfile.write(b"OK")

              do_GET = do_POST = do_HEAD = record

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", port), Handler).serve_forever()
          EOF

          cat > "$RUNNER_TEMP/bin/hb-start.sh" <<'EOF'
          #!/bin/sh
          requests="$RUNNER_TEMP/hb-requests.txt"
          : > "$requests"
          python3 -I "$RUNNER_TEMP/hb-listener.py" "$HB_PORT" "$requests" > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/hb.pid"
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$HB_PORT/ready"; then
              : > "$requests"; exit 0
            fi
            sleep 0.5
          done
          echo "heartbeat listener did not start"; exit 1
          EOF

          cat > "$RUNNER_TEMP/bin/hb-stop.sh" <<'EOF'
          #!/bin/sh
          pidfile="$RUNNER_TEMP/hb.pid"
          [ -f "$pidfile" ] || exit 0
          kill "$(cat "$pidfile")" 2>/dev/null || true
          rm -f "$pidfile"
          EOF

          cat > "$RUNNER_TEMP/bin/hb-expect.sh" <<'EOF'
          #!/bin/sh
          requests="$RUNNER_TEMP/hb-requests.txt"
          if [ "$#" -eq 0 ]; then : > "$RUNNER_TEMP/hb-expected.txt"; else printf '%s\n' "$@" > "$RUNNER_TEMP/hb-expected.txt"; fi
          echo "requests seen:"; cat "$requests"
          diff "$RUNNER_TEMP/hb-expected.txt" "$requests" || { echo "unexpected heartbeat requests"; exit 1; }
          EOF

          # check-log.sh already rejects "://" and 127.0.0.1; this also rejects
          # the path, which stands for the secret part of a real ping URL.
          cat > "$RUNNER_TEMP/bin/hb-check-log.sh" <<'EOF'
          #!/bin/sh
          check-log.sh "$1"
          if grep -qF -- ci-ping-key "$1"; then echo "log shows the ping URL"; exit 1; fi
          EOF

          chmod +x "$RUNNER_TEMP"/bin/*.sh

      - name: Heartbeat off by default, no request and no heartbeat line
        env:
          HB_PORT: '18099'
        run: |
          for f in first.log second.log; do
            ! grep -q heartbeat "$f" || { echo "$f has a heartbeat line"; exit 1; }
          done
          hb-start.sh
          trap hb-stop.sh EXIT
          run-backup.sh hb-unset.log
          ! grep -q heartbeat hb-unset.log || { echo "heartbeat line without HEARTBEAT_URL"; exit 1; }
          hb-expect.sh
          check-log.sh hb-unset.log

      - name: Heartbeat on a successful run sends start, then success
        env:
          HB_PORT: '18099'
          HB_URL: http://127.0.0.1:18099/ci-ping-key-must-not-be-logged/soctriage-backup
        run: |
          hb-start.sh
          trap hb-stop.sh EXIT
          run-backup.sh hb-ok.log -e HEARTBEAT_URL="$HB_URL" -e HEARTBEAT_ALLOW_HTTP=1
          hb-expect.sh "GET /ci-ping-key-must-not-be-logged/soctriage-backup/start" \
                       "GET /ci-ping-key-must-not-be-logged/soctriage-backup"
          grep -qF "heartbeat: sent (start)" hb-ok.log
          grep -qF "heartbeat: sent (success)" hb-ok.log
          grep -qF "finished: " hb-ok.log
          hb-check-log.sh hb-ok.log

      - name: Heartbeat on a failed run sends start, then the exit status with the step name
        env:
          HB_PORT: '18099'
          HB_URL: http://127.0.0.1:18099/ci-ping-key-must-not-be-logged/soctriage-backup
        run: |
          hb-start.sh
          trap hb-stop.sh EXIT
          status=0
          run-backup.sh hb-fail.log -e HEARTBEAT_URL="$HB_URL" -e HEARTBEAT_ALLOW_HTTP=1 \
            -e BUCKET=no-such-bucket || status=$?
          test "$status" -eq 1 || { echo "expected exit 1, got $status"; exit 1; }
          grep -qF "FAILED: upload failed" hb-fail.log
          hb-expect.sh "GET /ci-ping-key-must-not-be-logged/soctriage-backup/start" \
                       "POST /ci-ping-key-must-not-be-logged/soctriage-backup/1 failed step: upload"
          hb-check-log.sh hb-fail.log

          # A settings failure comes before /start and is still reported.
          : > "$RUNNER_TEMP/hb-requests.txt"
          status=0
          run-backup.sh hb-settings.log -e HEARTBEAT_URL="$HB_URL" -e HEARTBEAT_ALLOW_HTTP=1 \
            -e ENDPOINT= || status=$?
          test "$status" -eq 1 || { echo "expected exit 1, got $status"; exit 1; }
          hb-expect.sh "POST /ci-ping-key-must-not-be-logged/soctriage-backup/1 failed step: settings"
          hb-check-log.sh hb-settings.log

      - name: Heartbeat refuses a plain-http URL unless the test switch is set
        env:
          HB_PORT: '18099'
          HB_URL: http://127.0.0.1:18099/ci-ping-key-must-not-be-logged/soctriage-backup
        run: |
          hb-start.sh
          trap hb-stop.sh EXIT
          run-backup.sh hb-http.log -e HEARTBEAT_URL="$HB_URL"
          test "$(grep -c "heartbeat: HEARTBEAT_URL is not an https URL, ignored" hb-http.log)" -eq 1
          hb-expect.sh
          hb-check-log.sh hb-http.log

      - name: Heartbeat that cannot get through never fails the backup
        env:
          HB_URL: http://127.0.0.1:18099/ci-ping-key-must-not-be-logged/soctriage-backup
        run: |
          # No listener is running on the port.
          run-backup.sh hb-down.log -e HEARTBEAT_URL="$HB_URL" -e HEARTBEAT_ALLOW_HTTP=1
          grep -qF "heartbeat: could not reach the check (start)" hb-down.log
          grep -qF "heartbeat: could not reach the check (success)" hb-down.log
          grep -qF "finished: " hb-down.log
          hb-check-log.sh hb-down.log
