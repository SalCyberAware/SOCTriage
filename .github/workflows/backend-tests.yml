name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with backend/runtime.txt.
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # Installs ONLY the production lock, the way Railway does, on the Python
  # backend/runtime.txt names. Proves the hashed lock installs on Linux, that the
  # installed set is consistent (pip check), that the app sees exactly the lock's
  # versions (the same check /health reports as dependencies_locked), and that
  # the lock still matches requirements.in. Required by the main ruleset.
  hashed-production-install:
    name: Hashed production install
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with backend/runtime.txt and the lock's --python-version.
          python-version: '3.11.9'

      # A fresh venv with nothing in it, so nothing outside the lock can satisfy
      # a requirement. pip is not upgraded first: Railway does not either.
      - name: Install the production lock with hashes
        run: |
          python -m venv "$RUNNER_TEMP/prod"
          "$RUNNER_TEMP/prod/bin/pip" install --require-hashes -r requirements.txt

      - name: Check the installed set matches the lock
        run: |
          "$RUNNER_TEMP/prod/bin/pip" check
          "$RUNNER_TEMP/prod/bin/python" -c "import main; print('python', main.PYTHON_VERSION, 'dependencies_locked', main.DEPENDENCIES_LOCKED); assert main.DEPENDENCIES_LOCKED, 'installed packages differ from requirements.txt'"

      # uv keeps the pins already in an output file, so recompiling an unchanged
      # requirements.in reproduces the lock byte for byte. A diff means someone
      # edited requirements.in without regenerating, or edited the lock by hand.
      # uv is pinned so its output format cannot change underneath the check.
      - name: Check the locks still match their .in files
        run: |
          python -m pip install uv==0.12.18
          uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes --quiet --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -o requirements.txt" -o requirements.txt
          uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes --quiet --custom-compile-command "uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes -o requirements-dev.txt" -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt

  migrations-postgres:
    name: Migrations and tests on Postgres
    runs-on: ubuntu-latest

    # Production runs on Postgres; the job above runs on SQLite. This one builds
    # the schema the way production does -- Alembic, from an empty database to
    # head -- and then runs the whole suite against that schema.
    services:
      postgres:
        # Postgres 18, the production major. Pinned by digest, the same pin as
        # pg-backup.yml. Pulled from the GHCR mirror (docs in PromptShield's
        # docs/BASE_IMAGE_MIRROR.md) because public.ecr.aws answers runner pulls
        # with 429, and service containers start before any step can retry.
        image: ghcr.io/salcyberaware/mirror/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # mirror of public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: soctriage
          POSTGRES_DB: soctriage_ci
          # No password at all rather than a placeholder one: the service is
          # reachable only from this job and gone when it ends.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soctriage -d soctriage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway database that exists only for the length of this job.
      DATABASE_URL: postgresql://soctriage@localhost:5432/soctriage_ci
      SOCTRIAGE_TEST_DATABASE_URL: postgresql://soctriage@localhost:5432/soctriage_ci

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with backend/runtime.txt.
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Migrate an empty database to head
        run: alembic upgrade head

      # Fails if autogenerate would produce anything, i.e. if the models and
      # the migrations disagree about the schema.
      - name: Check the models match the migrations
        run: alembic check

      # Every downgrade must actually work, or it cannot be relied on in an
      # incident. Ends back at head for the tests.
      - name: Round-trip every migration down to empty and back up
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"

      - name: Run pytest against the migrated database
        run: pytest

  # Builds backend/Dockerfile, the image Railway runs, and starts it against a
  # throwaway Postgres the way production starts: the app migrates on startup,
  # so /health answering means the migrations finished.
  container:
    name: Backend container (build + smoke test)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 18, the production major. Pinned by digest, the same pin as
        # pg-backup.yml. Pulled from the GHCR mirror (docs in PromptShield's
        # docs/BASE_IMAGE_MIRROR.md) because public.ecr.aws answers runner pulls
        # with 429, and service containers start before any step can retry.
        image: ghcr.io/salcyberaware/mirror/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # mirror of public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: soctriage
          POSTGRES_DB: soctriage_ci
          # No password at all rather than a placeholder one: the service is
          # reachable only from this job and gone when it ends.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soctriage -d soctriage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Decoys prove .dockerignore keeps env files out of the image, including
      # one inside a folder the allowlist lets in.
      - name: Plant decoy .env files
        run: |
          echo "DECOY=1" > .env
          echo "DECOY=1" > services/.env

      # CI takes the base image from the GHCR mirror that PromptShield's
      # .github/workflows/mirror-base-images.yml keeps, because public.ecr.aws
      # answers anonymous pulls from GitHub runners with 429 "Data limit
      # exceeded" now and then. The Dockerfile keeps its public.ecr.aws FROM
      # lines, so Railway and Dependabot see no change. Pointing public.ecr.aws
      # at 0.0.0.0 for the rest of this job makes the build fail instead of
      # quietly falling back to it.
      - name: Block public.ecr.aws for the rest of the job
        run: |
          echo "0.0.0.0 public.ecr.aws" | sudo tee -a /etc/hosts >/dev/null
          if curl -s -o /dev/null --max-time 10 https://public.ecr.aws/v2/; then
            echo "public.ecr.aws is still reachable"; exit 1
          fi
          echo "public.ecr.aws blocked"

      # For each digest-pinned FROM ref, pull the mirror copy of the same digest
      # with backoff (waits of 20, 40, 80 and 160 s, now for GHCR hiccups),
      # check that the image pulled has exactly the Dockerfile's digest, and
      # record a --build-context that makes the build use it in place of the
      # FROM ref. The mirror path is the ref without public.ecr.aws/docker/library/.
      - name: Pull the base image from the GHCR mirror (with retries)
        env:
          DOCKERFILES: Dockerfile
          MIRROR: ghcr.io/salcyberaware/mirror
          UPSTREAM: public.ecr.aws/docker/library/
        run: |
          refs=$(echo "$DOCKERFILES" | xargs grep -hiE '^[[:space:]]*FROM[[:space:]]' | grep -oE '[^[:space:]]+@sha256:[0-9a-f]{64}' | sort -u) || true
          test -n "$refs" || { echo "no digest-pinned FROM line in $DOCKERFILES"; exit 1; }
          contexts="$RUNNER_TEMP/base-image-contexts"
          : > "$contexts"
          pull_err="$RUNNER_TEMP/base-image-pull.err"
          for ref in $refs; do
            name_tag=${ref%%@*}
            pinned=${ref#*@}
            case $name_tag in
              "$UPSTREAM"*) ;;
              *) echo "$name_tag is not under $UPSTREAM, so it has no mirror path"; exit 1 ;;
            esac
            path=${name_tag#"$UPSTREAM"}
            mirror_ref="$MIRROR/$path@$pinned"
            echo "Pulling $MIRROR/$path at $pinned (Dockerfile pin)"
            attempt=0
            pulled=0
            for wait_s in 20 40 80 160 last; do
              attempt=$((attempt + 1))
              status=0
              docker pull --quiet "$mirror_ref" >/dev/null 2>"$pull_err" || status=$?
              echo "attempt $attempt: exit $status"
              if [ "$status" -eq 0 ]; then pulled=1; break; fi
              if [ "$wait_s" != last ]; then sleep "$wait_s"; fi
            done
            if [ "$pulled" -ne 1 ]; then
              echo "Every attempt failed. Last 5 lines of the last error:"
              tail -n 5 "$pull_err"
              exit 1
            fi
            got=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$mirror_ref" \
              | grep -E "^$MIRROR/${path%%:*}@sha256:[0-9a-f]{64}$" | sed 's/.*@//' | sort -u)
            if [ "$got" != "$pinned" ]; then
              echo "digest mismatch for $path: Dockerfile pins $pinned, mirror image has ${got:-none}"
              exit 1
            fi
            echo "digest match: $MIRROR/${path%%:*}@$got equals the Dockerfile pin"
            printf '%s\n' --build-context "$ref=docker-image://$mirror_ref" >> "$contexts"
          done

      # Plain progress, so the log names the registry each base image came from.
      - name: Build the image
        run: |
          mapfile -t contexts < "$RUNNER_TEMP/base-image-contexts"
          test "${#contexts[@]}" -gt 0 || { echo "no base image context recorded"; exit 1; }
          docker build --progress=plain "${contexts[@]}" -t soctriage-backend:ci .

      - name: Image runs as non-root and holds no env file, tests or dev tooling
        run: |
          uid=$(docker run --rm --entrypoint id soctriage-backend:ci -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          docker run --rm --entrypoint sh soctriage-backend:ci -c '
            found=$(find / -xdev \( -name ".env" -o -path "/app/tests" -o -name "conftest.py" \
                      -o -name "requirements-dev.*" -o -name "Procfile" -o -name "*.db" \) \
                      -not -path "/proc/*" 2>/dev/null)
            test -z "$found" || { echo "unexpected files:"; echo "$found"; exit 1; }'

      # Host networking so the container reaches the Postgres service on
      # localhost. PORT=9090 rather than the default 8080, to prove the
      # container listens on whatever port the platform hands it. The commit
      # goes in RAILWAY_GIT_COMMIT_SHA, the variable /health reads first in
      # production. FRONTEND_URL is a placeholder origin, and no key is set.
      - name: Start the container and check /health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          docker run -d --name api --network host \
            -e PORT=9090 -e FRONTEND_URL=https://example.com \
            -e DATABASE_URL=postgresql://soctriage@127.0.0.1:5432/soctriage_ci \
            -e RAILWAY_GIT_COMMIT_SHA="$EXPECTED_SHA" soctriage-backend:ci
          for _ in $(seq 1 30); do
            curl -fsS -o health.json http://127.0.0.1:9090/health && break
            sleep 2
          done
          test -s health.json || { echo "no healthy answer in 60s"; exit 1; }
          python3 - <<'EOF'
          import json, os
          h = json.load(open("health.json"))
          assert h["status"] == "ok", h["status"]
          assert h["commit"] == os.environ["EXPECTED_SHA"], h["commit"]
          assert h["python"] == "3.11", h["python"]
          assert h["dependencies_locked"] is True, "installed packages differ from backend/requirements.txt"
          print("health ok:", {k: h[k] for k in ("commit", "python", "dependencies_locked")})
          EOF

      # Startup ran init_db, the same path production takes. The database must
      # now be at the newest migration, with the columns the models expect.
      - name: Migrations ran on startup
        run: |
          docker exec -i api python - <<'EOF'
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import inspect

          from database import engine

          head = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          with engine.connect() as connection:
              current = MigrationContext.configure(connection).get_current_revision()
              columns = {c["name"] for c in inspect(connection).get_columns("cases")}
          assert current == head, (current, head)
          assert "owner_hash" in columns, columns
          print("migrations ok: database at", current)
          EOF

      # A triage builds the Anthropic request and parses its tool call, calls
      # ThreatScan, applies the severity floor, builds MITRE links, writes a
      # case and an audit line. None of that runs at startup, so a module or
      # file missing from the image would pass /health and fail the first real
      # triage. This runs one end to end inside the container with both outbound
      # clients answered in-process: no model call, no ThreatScan call. The
      # system prompt and the ATT&CK ID check are in the code; no prompt or
      # MITRE data files are read.
      - name: Run a triage inside the container with no outbound calls
        run: |
          docker exec -i api python - <<'EOF'
          import json
          import types

          import httpx
          import httpx2
          from anthropic import AsyncAnthropic
          from fastapi.testclient import TestClient

          import main
          from services import ai_engine, enrichment

          # The container was started with no key, so the real client has none.
          assert ai_engine.client.api_key is None, "an Anthropic key reached the container"

          hosts = []


          def model(request):
              hosts.append(request.url.host)
              assert request.url.path == "/v1/messages", request.url
              body = json.loads(request.content)
              tool = body["tool_choice"]["name"]
              return httpx2.Response(200, json={
                  "id": "msg_smoke", "type": "message", "role": "assistant",
                  "model": body["model"], "stop_reason": "tool_use", "stop_sequence": None,
                  "usage": {"input_tokens": 1, "output_tokens": 1},
                  "content": [{"type": "tool_use", "id": "toolu_smoke", "name": tool, "input": {
                      "title": "Container smoke test", "severity": "low", "summary": "Offline check.",
                      "affected_assets": ["WS-1"], "threat_type": "Command and control",
                      "mitre_techniques": [{"technique_id": "T1071", "technique_name": "Application Layer Protocol",
                                            "tactic": "Command and Control", "description": "Offline check."}],
                      "recommended_actions": ["Block the address"], "playbook": ["Isolate the host"],
                  }}],
              })


          def threatscan(request):
              hosts.append(request.url.host)
              assert request.url.path.endswith("/scan"), request.url
              return httpx.Response(200, json={"verdict": "malicious", "score": 80, "engines": []})


          # Both outbound clients answer from in-process handlers: no request leaves the
          # container, and the key is a placeholder that never reaches Anthropic. The
          # SDK runs on httpx2, enrichment on httpx, so each gets its own transport.
          ai_engine.client = AsyncAnthropic(
              api_key="placeholder", http_client=httpx2.AsyncClient(transport=httpx2.MockTransport(model)))


          class OfflineAsyncClient(httpx.AsyncClient):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, transport=httpx.MockTransport(threatscan), **kwargs)


          enrichment.httpx = types.SimpleNamespace(AsyncClient=OfflineAsyncClient)

          token = {"X-Session-Token": "container-smoke-test-token"}
          with TestClient(main.app) as api:
              r = api.post("/api/triage", headers=token, json={"ioc": "198.51.100.7", "ioc_type": "ip",
                                                              "raw_alert": "Outbound beacon from WS-1"})
              assert r.status_code == 200, (r.status_code, r.text)
              out = r.json()
              report = out["report"]
              assert out["enrichment"]["verdict"] == "malicious", out["enrichment"]
              assert report["severity"] == "high", "severity floor did not apply"
              assert report["mitre_techniques"][0]["mitre_url"] == "https://attack.mitre.org/techniques/T1071/"
              case = api.get(f"/api/cases/{out['case_id']}", headers=token)
              assert case.status_code == 200, (case.status_code, case.text)
              assert case.json()["report"]["title"] == "Container smoke test"

          assert sorted(set(hosts)) == ["api.anthropic.com", "threatscan-production.up.railway.app"], hosts
          print("triage path ok: case", out["case_id"], "stored and read back,", len(hosts), "offline calls")
          EOF

      - name: Container logs
        if: always()
        run: docker logs api || true
