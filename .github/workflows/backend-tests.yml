name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Keep in sync with backend/runtime.txt.
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # Installs ONLY the production lock, the way Railway does, on the Python
  # backend/runtime.txt names. Proves the hashed lock installs on Linux, that the
  # installed set is consistent (pip check), that the app sees exactly the lock's
  # versions (the same check /health reports as dependencies_locked), and that
  # the lock still matches requirements.in. Required by the main ruleset.
  hashed-production-install:
    name: Hashed production install
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Keep in sync with backend/runtime.txt and the lock's --python-version.
          python-version: '3.11.9'

      # A fresh venv with nothing in it, so nothing outside the lock can satisfy
      # a requirement. pip is not upgraded first: Railway does not either.
      - name: Install the production lock with hashes
        run: |
          python -m venv "$RUNNER_TEMP/prod"
          "$RUNNER_TEMP/prod/bin/pip" install --require-hashes -r requirements.txt

      - name: Check the installed set matches the lock
        run: |
          "$RUNNER_TEMP/prod/bin/pip" check
          "$RUNNER_TEMP/prod/bin/python" -c "import main; print('python', main.PYTHON_VERSION, 'dependencies_locked', main.DEPENDENCIES_LOCKED); assert main.DEPENDENCIES_LOCKED, 'installed packages differ from requirements.txt'"

      # uv keeps the pins already in an output file, so recompiling an unchanged
      # requirements.in reproduces the lock byte for byte. A diff means someone
      # edited requirements.in without regenerating, or edited the lock by hand.
      # uv is pinned so its output format cannot change underneath the check.
      - name: Check the locks still match their .in files
        run: |
          python -m pip install uv==0.12.18
          uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes --quiet --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -o requirements.txt" -o requirements.txt
          uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes --quiet --custom-compile-command "uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes -o requirements-dev.txt" -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt

  migrations-postgres:
    name: Migrations and tests on Postgres
    runs-on: ubuntu-latest

    # Production runs on Postgres; the job above runs on SQLite. This one builds
    # the schema the way production does -- Alembic, from an empty database to
    # head -- and then runs the whole suite against that schema.
    services:
      postgres:
        # Keep the major version in step with the Railway Postgres service.
        image: postgres:16
        env:
          POSTGRES_USER: soctriage
          POSTGRES_DB: soctriage_ci
          # No password at all rather than a placeholder one: the service is
          # reachable only from this job and gone when it ends.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soctriage -d soctriage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway database that exists only for the length of this job.
      DATABASE_URL: postgresql://soctriage@localhost:5432/soctriage_ci
      SOCTRIAGE_TEST_DATABASE_URL: postgresql://soctriage@localhost:5432/soctriage_ci

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Keep in sync with backend/runtime.txt.
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Migrate an empty database to head
        run: alembic upgrade head

      # Fails if autogenerate would produce anything, i.e. if the models and
      # the migrations disagree about the schema.
      - name: Check the models match the migrations
        run: alembic check

      # Every downgrade must actually work, or it cannot be relied on in an
      # incident. Ends back at head for the tests.
      - name: Round-trip every migration down to empty and back up
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"

      - name: Run pytest against the migrated database
        run: pytest
