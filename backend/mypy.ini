# mypy configuration for the SOCTriage backend.
#
# NOT strict yet, deliberately. Measured on this tree:
#
#   scope              default   this config   --strict
#   application code       6          7           24
#   application + tests    9         ---         174
#
# Strict's extra 17 findings on application code are almost entirely
# no-untyped-def (missing return annotations on FastAPI handlers), and its 174
# with tests are overwhelmingly annotate-every-test-function churn. This config
# instead takes the checks that find bugs and skips the ones that only ask for
# annotations: it cost 1 extra finding over bare default and caught a real 500.
#
# Path to strict, in order, each step small enough to review:
#   1. annotate the return types of the route handlers and main.py  (clears
#      most of the 17, lets disallow_untyped_defs go on for application code)
#   2. add disallow_untyped_defs + disallow_incomplete_defs here
#   3. extend `files` to tests/ and annotate the test suite
#   4. replace this whole block with `strict = True`, matching PromptShield
#
# Tests are out of scope for now (PromptShield likewise runs mypy over its
# package, not its tests). ruff covers tests/ in the meantime.
[mypy]
python_version = 3.11
files = main.py, auth.py, limits.py, models.py, database.py, routes, services

# routes/ and services/ have no __init__.py and are imported as top-level
# modules with the backend directory on the path, the way pytest.ini and
# uvicorn both run them.
mypy_path = .
explicit_package_bases = True

# Third-party packages without bundled stubs (sqlalchemy plugins, httpx extras).
ignore_missing_imports = True

# The bug-catching half of strict, none of the annotation tax.
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True
disallow_untyped_calls = True
check_untyped_defs = True
